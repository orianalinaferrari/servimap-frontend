# Application sources and test code are disjoint, without coverage/CPD exclusions.
sonar.projectKey=orianalinaferrari_servimap-frontend
sonar.organization=orianalinaferrari
sonar.host.url=https://sonarcloud.io
sonar.sources=src/App.jsx,src/main.jsx,src/App.css,src/index.css,src/components,src/context,src/data,src/pages,src/routes,src/services,src/styles,src/utils,scripts,.github,public,index.html,package.json,package-lock.json,vercel.json,vite.config.js,eslint.config.js
sonar.tests=src/tests
sonar.sourceEncoding=UTF-8
# Binary web fonts are not source text; indexing them as UTF-8 triggers encoding warnings.
sonar.exclusions=public/fonts/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
